# Stack: Caddy (TLS) -> gateway -> sandbox-runner -> per-user sandbox containers.
# Only sandbox-runner mounts the Docker socket. Services share the compose `default` network; sandboxes
# are never on it (each gets its own internal network from sandbox-runner), so they cannot reach the runner.
name: dshcloud
services:
  sandbox-image:
    build: ../sandbox
    image: dsh-sandbox:latest
    entrypoint: ["true"] # build only; real sandboxes are created by sandbox-runner
    restart: "no"
  gateway:
    restart: unless-stopped # a crash or a reboot must not leave the site down (docs/security-review.md, SEC-03)
    build: ../gateway
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      llm-proxy:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    labels:
      dsh-cloud.role: gateway # sandbox-runner attaches it to every user network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({ socketPath: process.env.GATEWAY_SOCKET, path: '/gw/healthz' }, (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      # No TCP port: the gateway listens on a unix socket that only Caddy shares, so a sandbox cannot reach it (SEC-04).
      GATEWAY_SOCKET: /run/gw/gateway.sock
      PUBLIC_URL: https://localhost/
      RUNNER_URL: http://sandbox-runner:8090
      RUNNER_SECRET: ${RUNNER_SECRET:?set RUNNER_SECRET in .env (see .env.example)}
      IDLE_SECONDS: ${IDLE_SECONDS:-1800}
      REAP_INTERVAL_SECONDS: ${REAP_INTERVAL_SECONDS:-30}
      # Crash watchdog: restart a sandbox that exits on its own within seconds; hold it after repeated exits (see docs/plan-phase-5.md).
      WATCHDOG_SECONDS: ${WATCHDOG_SECONDS:-5}
      CRASH_MAX_RESTARTS: ${CRASH_MAX_RESTARTS:-3}
      CRASH_WINDOW_SECONDS: ${CRASH_WINDOW_SECONDS:-600}
      # Sign-up needs an invite code (scripts/invite.sh) unless ALLOW_SIGNUP=true.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      MAX_RUNNING_SANDBOXES: ${MAX_RUNNING_SANDBOXES:-20} # 0 = unlimited
      # A sandbox whose agent is busy (model calls or CPU use) stays up with no browser attached, up to this long after
      # the user's last activity (0 = stop idle sandboxes as before). Idle stop is IDLE_SECONDS.
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Workspace} # replaces the harness's "DSH Local Build" label in the sidebar
      MAX_BUSY_SECONDS: ${MAX_BUSY_SECONDS:-7200}
      BUSY_CPU_PERCENT: ${BUSY_CPU_PERCENT:-5} # of one CPU, averaged over the reap interval
      BUSY_SIGNAL_SECONDS: ${BUSY_SIGNAL_SECONDS:-300} # how long a model call or CPU burst keeps counting as busy
      MAX_RUN_SECONDS: ${MAX_RUN_SECONDS:-28800} # continuous run time per sandbox; 0 = unlimited
      MAX_DISK_MB: ${MAX_DISK_MB:-2048} # per user, both volumes; 0 = unlimited
      DISK_CHECK_SECONDS: ${DISK_CHECK_SECONDS:-300}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90} # audit rows kept this long; 0 = forever
      # Outgoing mail (docs/email.md): password reset, emailed invites, "your workspace finished". Off unless MAIL_PROVIDER is set.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_REGION: ${MAILGUN_REGION:-us}
      MAIL_OUTBOX_DIR: ${MAIL_OUTBOX_DIR:-}
      MAIL_MAX_PER_ADDRESS_HOUR: ${MAIL_MAX_PER_ADDRESS_HOUR:-5}
      MAIL_MAX_PER_HOUR: ${MAIL_MAX_PER_HOUR:-100}
      MAIL_RESET_MINUTES: ${MAIL_RESET_MINUTES:-60}
      MAIL_TASK_NOTICES: ${MAIL_TASK_NOTICES:-true}
      MAIL_TASK_NOTICE_HOURS: ${MAIL_TASK_NOTICE_HOURS:-6}
      EVICT_AFTER_IDLE_SECONDS: ${EVICT_AFTER_IDLE_SECONDS:-300} # when full, sandboxes idle this long may be stopped for a newcomer
      # The waiting room (docs/plan-phase-5.md, P5-9): when full and nothing can be stopped, a newcomer waits in line.
      WAIT_QUEUE_SECONDS: ${WAIT_QUEUE_SECONDS:-600} # longest wait; 0 = refuse at once
      MAX_WAITING: ${MAX_WAITING:-50} # people allowed in line; more are refused
      WAIT_POLL_MS: ${WAIT_POLL_MS:-2000}
      WAIT_ABANDON_SECONDS: ${WAIT_ABANDON_SECONDS:-30} # someone whose page stopped asking this long leaves the line
      LLM_ADMIN_SOCKET: /run/llm-admin/admin.sock
      LLM_ADMIN_SECRET: ${LLM_ADMIN_SECRET:?set LLM_ADMIN_SECRET in .env (see .env.example)}
    volumes:
      - gateway-data:/data
      - llm-admin:/run/llm-admin # admin socket of llm-proxy; mounted by nothing else
      - gateway-socket:/run/gw # the gateway's own socket; mounted by Caddy and nothing else
    expose:
      - "8080"
  # The only holder of the Docker socket. Builds every sandbox container spec itself from a user id
  # and token; reachable only by services on the compose network (never by sandboxes).
  sandbox-runner:
    restart: unless-stopped # a crash or a reboot must not leave the site down (docs/security-review.md, SEC-03)
    build: ../runner
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    environment:
      PUBLIC_URL: https://localhost/
      RUNNER_SECRET: ${RUNNER_SECRET:?set RUNNER_SECRET in .env (see .env.example)}
      SANDBOX_IMAGE: dsh-sandbox:latest
      # OCI runtime for user sandboxes: runc by default; runsc (gVisor) once registered with the Docker daemon.
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
      LLM_PROXY_URL: http://llm-proxy:8081
      # Web access for sandboxes only through egress-proxy, which the runner attaches to every user network.
      SHARED_ROLES: gateway,llm-proxy,egress-proxy
      EGRESS_PROXY_URL: http://egress-proxy:3128
      SHOW_HARNESS_SIGN_IN: ${SHOW_HARNESS_SIGN_IN:-false}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openrouter/free}
      MODEL_DISPLAY_NAME: ${MODEL_DISPLAY_NAME:-} # how the model is named in the picker; empty = a friendly default for the free router
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-16384} # most one model reply may produce (harness setting; the llm-proxy clamps at MAX_OUTPUT_TOKENS)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8090"
  # Holds the real provider key. No published port. Sandboxes reach its /v1 API over their user network
  # with per-user tokens; the admin API is a unix socket on the llm-admin volume, shared only with the
  # gateway (and still needs LLM_ADMIN_SECRET).
  llm-proxy:
    restart: unless-stopped # a crash or a reboot must not leave the site down (docs/security-review.md, SEC-03)
    build: ../llm-proxy
    labels:
      dsh-cloud.role: llm-proxy # sandbox-runner attaches it to every user network
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-${LLM_BASE_URL:-https://openrouter.ai/api/v1}}
      # OPENROUTER_API_KEY / LLM_BASE_URL are accepted for existing .env files.
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-${OPENROUTER_API_KEY:-}}
      ADMIN_SECRET: ${LLM_ADMIN_SECRET:?set LLM_ADMIN_SECRET in .env (see .env.example)}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-${DEFAULT_MODEL:-openrouter/free}}
      DAILY_TOKEN_QUOTA: ${DAILY_TOKEN_QUOTA:-500000}
      MONTHLY_TOKEN_QUOTA: ${MONTHLY_TOKEN_QUOTA:-5000000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-4}
      GLOBAL_DAILY_TOKEN_BUDGET: ${GLOBAL_DAILY_TOKEN_BUDGET:-5000000} # all users together per UTC day; 0 = unlimited
      ADMIN_SOCKET: /run/llm-admin/admin.sock
    volumes:
      - llm-proxy-data:/data
      - llm-admin:/run/llm-admin
    expose:
      - "8081"
  # The only path out of a user network. On the compose network (which has internet) and, via the runner,
  # on every user network. Refuses private, loopback, link-local and metadata destinations; logs every request.
  egress-proxy:
    restart: unless-stopped # a crash or a reboot must not leave the site down (docs/security-review.md, SEC-03)
    build: ../egress-proxy
    labels:
      dsh-cloud.role: egress-proxy # sandbox-runner attaches it to every user network
    environment:
      ALLOWED_PORTS: ${EGRESS_ALLOWED_PORTS:-80,443}
      # Scope: empty = any public host. Set to a comma-separated list (example.com, *.example.com, an IPv4 address) and only those hosts
      # plus the base list (what git, pip, npm, Go and the vulnerability scanners need) are reachable. scripts/egress-scope.sh edits it.
      EGRESS_ALLOW_HOSTS: ${EGRESS_ALLOW_HOSTS:-}
      EGRESS_BASE_HOSTS: ${EGRESS_BASE_HOSTS:-} # empty = the built-in base list; "none" = no base list
      # Limits per sandbox and per destination host (empty = the defaults in egress-proxy/README.md; 0 = off).
      RATE_PER_SOURCE: ${EGRESS_RATE_PER_SOURCE:-}
      RATE_PER_DESTINATION: ${EGRESS_RATE_PER_DESTINATION:-}
      MAX_CONNECTIONS_PER_SOURCE: ${EGRESS_MAX_CONNECTIONS_PER_SOURCE:-}
      MAX_CONNECTIONS_PER_DESTINATION: ${EGRESS_MAX_CONNECTIONS_PER_DESTINATION:-}
      LIMIT_WAIT_SECONDS: ${EGRESS_LIMIT_WAIT_SECONDS:-}
    expose:
      - "3128"
  proxy:
    restart: unless-stopped # a crash or a reboot must not leave the site down (docs/security-review.md, SEC-03)
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.gateway:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - gateway-socket:/run/gw # the only way to the gateway: no sandbox shares this volume
    depends_on:
      - gateway
networks:
  # Caddy <-> gateway <-> llm-proxy. Sandboxes are not on it: each gets an internal network
  # `dsh-net-<id>` from sandbox-runner, shared only with the gateway and llm-proxy.
  default:
    name: dsh-sandboxes
volumes:
  gateway-data:
  llm-proxy-data:
  llm-admin:
  gateway-socket:
  caddy-data:
